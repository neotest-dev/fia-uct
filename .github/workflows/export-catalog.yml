name: Exportar catálogo de cursos a courses.json

on:
  # Cron: medianoche hora de Perú (UTC-5) = 05:00 UTC
  schedule:
    - cron: '0 5 * * *'

  # También se puede disparar manualmente desde GitHub.com
  # Actions → "Exportar catálogo..." → Run workflow
  workflow_dispatch:

  # Disparo automático desde el panel admin vía serverless seguro.
  repository_dispatch:
    types: [catalog-updated]

jobs:
  export-catalog:
    name: Exportar Firestore → courses.json
    runs-on: ubuntu-latest

    # Solo ejecutar en la rama principal
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          # Token con permisos de escritura para poder hacer commit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Exportar catálogo desde Firestore
        env:
          # Service Account de Firebase Admin SDK
          # Configurar en: GitHub → Settings → Secrets → Actions → New repository secret
          # Nombre del secret: FIREBASE_SERVICE_ACCOUNT_JSON
          # Valor: contenido completo del archivo firebase-service-account.json (en una línea)
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run export:catalog

      - name: Verificar si courses.json fue modificado
        id: check_changes
        run: |
          if git diff --quiet public/courses.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ courses.json no cambió — no hay nuevos cursos desde la última exportación."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ courses.json fue actualizado."
          fi

      - name: Commit y push del catálogo actualizado
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/courses.json
          git commit -m "chore(catalog): actualizar catálogo automáticamente [$(date -u +'%Y-%m-%d')]"
          git push
